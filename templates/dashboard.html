{% extends "base.html" %}
{% block content %}

<div class="dashboard-header">
    <h2>Welcome, {{ session['username'] }}!</h2>
    <p class="subtitle">Get AI-powered insights to improve your resume</p>
</div>

<div class="card">
    <h3>📄 Resume Analyzer</h3>
    
    <form method="POST" enctype="multipart/form-data" class="analyze-form">
        <div class="form-group">
            <label for="role">Target Role *</label>
            <input 
                type="text" 
                name="role" 
                id="role"
                placeholder="e.g., Backend Engineer, Data Scientist, Full Stack Developer" 
                required
            >
        </div>

        <div class="form-group">
            <label for="resume">Paste Resume (Optional)</label>
            <textarea 
                name="resume" 
                id="resume"
                rows="6"
                placeholder="Paste your resume text here..."
            ></textarea>
        </div>

        <div class="form-divider">
            <span>OR</span>
        </div>

        <div class="form-group">
            <label for="file">Upload Resume File</label>
            <input 
                type="file" 
                name="file" 
                id="file"
                accept=".pdf,.docx"
            >
            <small class="help-text">Supports PDF and DOCX files</small>
        </div>

        <button type="submit" class="btn-primary">
            ✨ Analyze Resume
        </button>
    </form>
</div>

{% if result %}
<div class="result-card">
    <h3>🎯 Analysis Results</h3>
    <div class="result-content ai-result">
        {{ result|safe }}
    </div>
</div>
{% endif %}

{% endblock %}
